<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V7 Audit Workspace</title>
<link rel="stylesheet" href="/static/css/style.css?v=8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="top-bar">
  <div class="logo">
    <span class="logo-v7">V7</span><span class="logo-audit">AUDIT</span><span class="logo-wksp">WORKSPACE</span>
  </div>
  <div class="actions">
    <button class="btn-icon" onclick="openConfig()" title="Configuration">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </button>
  </div>
</div>

<main class="workspace">
  <!-- Left Panel: Submission and Report -->
  <section class="panel panel-left">
    <div class="panel-header">
      <h2>AUDIT SUBJECT</h2>
    </div>
    <div class="input-container glass-panel">
      <textarea id="promptArea" placeholder="Enter claims or text to audit..." rows="4"></textarea>
      <div class="input-actions">
        <button class="btn-primary" id="runBtn" onclick="runAudit()">INITIATE AUDIT</button>
      </div>
    </div>

    <div class="panel-header mt-lg" id="reportHeader" style="display: none;">
      <h2>EVALUATION REPORT</h2>
    </div>
    
    <div id="reportContainer" class="report-container">
      <!-- Generated Report goes here -->
    </div>
  </section>

  <!-- Right Panel: Hooks execution trace -->
  <section class="panel panel-right">
    <div class="panel-header">
      <h2>HOOK TRACE LOG</h2>
      <span class="pulse-indicator" id="pulse" style="display:none;"></span>
    </div>
    <div class="hook-log glass-panel" id="hookLog">
      <div class="log-entry sys">System initialized. Awaiting parameters.</div>
    </div>
  </section>
</main>

<!-- Config Panel Overlay -->
<div class="overlay" id="overlay" onclick="closeConfig()"></div>
<div class="config-sidebar" id="configSidebar">
  <div class="config-header">
    <h3>NODE CONFIGURATION</h3>
    <button class="btn-icon" onclick="closeConfig()">✕</button>
  </div>
  <div class="config-body">
    <div class="cfg-group">
      <label>OpenAI API Key</label>
      <input type="password" id="cfgOai" placeholder="sk-...">
      <button class="btn-secondary" onclick="saveOai()">Save</button>
      <div id="stOai" class="status-text"></div>
    </div>
    <div class="cfg-group mt-lg">
      <label>Tavily Search API Key</label>
      <input type="password" id="cfgTav" placeholder="tvly-...">
      <button class="btn-secondary" onclick="saveTav()">Save</button>
      <div id="stTav" class="status-text"></div>
      <label class="check-label mt-sm">
        <input type="checkbox" id="cfgTavEn" onchange="toggleTav(this.checked)">
        <span>Enable Live Search Plugin</span>
      </label>
    </div>
  </div>
</div>

<script src="/static/js/app.js?v=7"></script>
</body>
</html>
