name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
    - name: Install dependencies
      run: python -m pip install -r requirements.txt
    - name: Install CI tools
      run: python -m pip install ruff==0.16.2
    - name: Lint with ruff
      run: python -m ruff check . --no-cache --isolated --select E4,E7,E9,F
    - name: Run tests
      run: python -m pytest tests/ -v --tb=short

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Dockerfile.local --tag epistemic-pipeline:$(date +%s)
