name: Bug Report
description: Report a bug in the epistemic pipeline
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Send POST /api/pipeline with prompt "..."
        2. Observe the response...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Pipeline version (check /health endpoint)
      placeholder: "3.0.0"
  - type: dropdown
    id: tier
    attributes:
      label: Verification Tier
      options:
        - strict
        - standard
        - light
